  <path class="ln" marker-end="url(#arrow)" d="M1195 525 V670"/>
  <text class="lbl" x="1207" y="602">1:N</text>

  <path class="ln" marker-end="url(#arrow)" d="M520 220 H70 V985 H385 V1010"/>
  <text class="lbl" x="80" y="978">1:N</text>

  <path class="ln" marker-end="url(#arrow)" d="M880 220 H1880 V985 H925 V1010"/>
