  <!-- Connectors with cardinality -->
  <path class="ln" marker-end="url(#arrow)" d="M420 145 H520"/>
  <text class="lbl" x="465" y="136">1:N</text>

  <path class="ln" marker-end="url(#arrow)" d="M980 150 H930 V40 H430 V145 H420"/>
  <text class="lbl" x="640" y="32">1:N</text>

  <path class="ln" marker-end="url(#arrow)" d="M460 440 H560"/>
  <text class="lbl" x="505" y="430">1:N</text>

