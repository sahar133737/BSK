  <text class="lbl" x="730" y="464">1:N</text>

  <path class="ln" marker-end="url(#arrow)" d="M700 235 V300 H900 V340"/>
  <text class="lbl" x="785" y="292">1:N</text>

  <path class="ln" marker-end="url(#arrow)" d="M940 440 V560 H1438 V744 H1460"/>
  <text class="lbl" x="1170" y="432">1:N</text>

  <path class="ln" marker-end="url(#arrow)" d="M1625 525 V670"/>
