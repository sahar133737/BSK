  <path class="ln" marker-end="url(#arrow)" d="M880 210 H1960 V985 H1465 V1010"/>
  <text class="lbl" x="1360" y="978">1:N</text>

  <path class="ln" marker-end="url(#arrow)" d="M880 210 H1900 V640 H1200 V670"/>
  <text class="lbl" x="1455" y="632">1:N</text>

  <text class="lbl" x="1520" y="645">M:N (RepairRequests ↔ SpareParts через RepairRequestParts)</text>
</svg>
