<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
  <defs>
    <style>
      .box { fill:#fff; stroke:#000; stroke-width:1.2; }
      .t { font-family:"Times New Roman", serif; font-size:18px; }
      .th { font-family:"Times New Roman", serif; font-size:18px; font-weight:bold; }
      .ln { stroke:#000; stroke-width:1.2; fill:none; }
      .lbl { font-family:"Times New Roman", serif; font-size:14px; }
      .card { fill:#fff; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>

  <!-- Tables -->
  <g>
    <rect class="box card" x="120" y="80" width="300" height="120"/>
    <line class="ln" x1="120" y1="110" x2="420" y2="110"/>
    <text class="th" x="270" y="102" text-anchor="middle">Roles</text>
    <text class="t" x="132" y="136">Id (PK)</text>
    <text class="t" x="132" y="159">Name</text>
    <text class="t" x="132" y="182">AccessLevel</text>
  </g>

